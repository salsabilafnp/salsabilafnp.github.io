name: personal_web
description: "Sabil's personal portfolio web, build with Flutter."
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.0.6
  provider: ^6.1.2
  url_launcher: ^6.0.3
  flutter_bullet_list: ^0.0.4  
  font_awesome_flutter: ^10.9.1
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logos/

flutter_launcher_icons:
  web:
    generate: true
    image_path: "assets/logos/sabil-logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"